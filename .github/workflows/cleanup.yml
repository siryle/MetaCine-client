name: Prune iOS Build History

on:
  workflow_run:
    workflows: ["iOS Build and Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ios-history-retention
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep Three iOS Builds and Releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test retention policy
        run: node --test scripts/prune-github-history.test.mjs
      - name: Delete older build runs and IPA releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prune-github-history.mjs
